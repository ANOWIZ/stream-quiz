name: stream-quiz
services:
  game:
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file:
      - ${QUIZ_ENV_FILE:-/etc/stream-quiz.env}
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"
      DATABASE_URL: file:/app/data/quiz.db
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${QUIZ_DATA_DIR:-/srv/stream-quiz}/data:/app/data
      - ${QUIZ_DATA_DIR:-/srv/stream-quiz}/uploads:/app/uploads
      - ${QUIZ_DATA_DIR:-/srv/stream-quiz}/backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
